name: Bug report
description: Something in a Mergit repository does not work as documented
title: "bug: <short description>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Mergit is pre-implementation.** There is no runtime or deployed contract yet, so most
        reports here will be about tooling, build scripts, figures or docs. If the problem is an
        error in the *argument*, use the **Paper correction** form instead.

        The archived [`Mergit-proto`](https://github.com/mergit-io/Mergit-proto) is out of scope —
        it is a discarded prototype and will not be patched.

        For security vulnerabilities, **do not open a public issue** — see
        [SECURITY.md](https://github.com/mergit-io/.github/blob/main/SECURITY.md).

  - type: dropdown
    id: repo
    attributes:
      label: Repository
      options:
        - mergit-research (paper, figures, tooling)
        - mergit-docs (requirements)
        - mergit (runtime)
        - mergit-contracts (Solidity)
        - .github (org defaults, templates, profile)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands, in order.
      placeholder: |
        1. Clone the repo at commit abc1234
        2. Run `python paper/figures/fig_audit_rate.py`
        3. Observe the traceback below
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Paste the error verbatim — full traceback, not a summary.
      render: text

  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit SHA where you saw this.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, and the version of whatever tool is involved (Python, Node, Foundry, …).

  - type: textarea
    id: additional
    attributes:
      label: Anything else
      description: Workaround you found, related issues, a guess at the cause.
