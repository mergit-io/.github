name: Mechanism challenge
description: You found a way to profit by cheating, or a case where the incentives do not bind
title: "mechanism: <short description of the attack>"
labels: ["mechanism", "security", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Nothing is deployed, so there is no live system to attack and public discussion is fine.
        If you have found a *deployed* vulnerability (committed secrets, supply chain), stop and
        follow [SECURITY.md](https://github.com/mergit-io/.github/blob/main/SECURITY.md) instead.

        **Already an open issue for this?** Do not open a pull request against it without being
        assigned — comment on the issue with your approach and wait. See
        [CONTRIBUTING.md](https://github.com/mergit-io/.github/blob/main/CONTRIBUTING.md#before-you-start-work).
  - type: dropdown
    id: target
    attributes:
      label: Which mechanism
      options:
        - Verifiable Execution Receipts — commitment, hash chain, disclosure
        - TEE attestation and the trust it relocates
        - Verification economics — audit rate, stake, slashing
        - Concurrency cap on unresolved tasks
        - Cost-adjusted reputation — Beta/Gamma posteriors, decay
        - Routing — Thompson sampling, exploration subsidy
        - Settlement — escrow, dispute window, clawback
        - Sybil resistance and identity
        - Challenger incentives — the assumption that q > 0
        - Cross-mechanism / other
    validations:
      required: true

  - type: textarea
    id: attack
    attributes:
      label: The deviation
      description: What does the dishonest party do, step by step?
    validations:
      required: true

  - type: textarea
    id: profit
    attributes:
      label: Why it pays
      description: |
        Show the arithmetic against the stated model. Name the parameters you assume
        (V, S, λ, θ, p, q, c_exec) and where your assumption differs from the paper's.
      render: text
    validations:
      required: true

  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions your attack needs
      description: |
        Collusion? A compromised TEE? Repeated interaction? No challenger present? Be explicit —
        an attack that needs an assumption the threat model already excludes is still worth filing,
        but say so.
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested mitigation
      description: Optional. Including "I don't see one" is useful information.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues, and this is not a duplicate
          required: true
        - label: I have shown the arithmetic, and stated which assumptions I checked and which I did not
          required: true
        - label: I understand that a labelled hypothesis is welcome, but uncertainty presented as certainty is closed as not planned
          required: true
